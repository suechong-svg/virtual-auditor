<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 18 92 92" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Virtual Auditor</title>
  <style>
    .head   { transform-box: view-box; transform-origin: 60px 80px; animation: nod 7s ease-in-out infinite; }
    .body   { animation: breathe 4.5s ease-in-out infinite; }
    .eyes   { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .pupils { animation: look 9s ease-in-out infinite; }
    .glint  { animation: glint 6s ease-in-out infinite; }
    @keyframes nod {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25%      { transform: rotate(-2deg) translateY(-0.6px); }
      50%      { transform: rotate(0.5deg) translateY(0.4px); }
      75%      { transform: rotate(1.8deg) translateY(-0.3px); }
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-0.8px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.08); }
    }
    @keyframes look {
      0%, 30%, 100% { transform: translateX(0); }
      40%, 55%      { transform: translateX(0.9px); }
      65%, 80%      { transform: translateX(-0.7px); }
    }
    @keyframes glint {
      0%, 70%, 100% { opacity: 0; transform: translateX(0); }
      80%           { opacity: 0.85; }
      90%           { opacity: 0; transform: translateX(7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .head, .body, .eyes, .pupils, .glint { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEDEA"/>
      <stop offset="0.55" stop-color="#F4D3CE"/>
      <stop offset="1" stop-color="#E4DAFF"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22205A"/>
      <stop offset="1" stop-color="#14123A"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#DCA982"/>
      <stop offset="1" stop-color="#C38B66"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="120" height="120" fill="url(#bg)"/>

  <!-- body -->
  <g class="body">
    <path d="M10 124 C12 100 26 90 44 86 L60 84 L76 86 C94 90 108 100 110 124 Z" fill="url(#suit)"/>
    <!-- shirt -->
    <path d="M47 85 L60 106 L73 85 L66 82 L54 82 Z" fill="#FFFFFF"/>
    <!-- lapels -->
    <path d="M44 86 L60 110 L52 92 L54 84 Z" fill="#0E0C2C"/>
    <path d="M76 86 L60 110 L68 92 L66 84 Z" fill="#0E0C2C"/>
    <!-- tie -->
    <path d="M57.2 86 L62.8 86 L61.8 90 L58.2 90 Z" fill="#5500F9"/>
    <path d="M58.2 90 L61.8 90 L63.6 104 L60 108 L56.4 104 Z" fill="#5500F9"/>
    <path d="M58.6 92 L61.4 92 L61.9 96 L58.1 96 Z" fill="#7A3BFF" opacity="0.7"/>
    <!-- lanyard badge -->
    <rect x="79" y="98" width="10" height="7" rx="1.5" fill="#F4D3CE"/>
    <rect x="80.5" y="100" width="7" height="1.2" rx="0.6" fill="#5500F9"/>
  </g>

  <!-- head -->
  <g class="head">
    <!-- neck -->
    <path d="M52 68 L68 68 L68 82 C64 85 56 85 52 82 Z" fill="#B67E5B"/>
    <!-- ears -->
    <ellipse cx="40.5" cy="53" rx="3.4" ry="5.2" fill="#C38B66"/>
    <ellipse cx="79.5" cy="53" rx="3.4" ry="5.2" fill="#C38B66"/>
    <!-- face -->
    <ellipse cx="60" cy="51" rx="19.5" ry="23.5" fill="url(#skin)"/>

    <!-- hair: short, neat, side part -->
    <path d="M40.6 50 C38.5 33 47 25 60 25 C73.5 25 82 33 79.4 50
             C78.6 44 77.5 40.5 75.5 38.5 C70 36.2 63 35.6 56 36
             C50.5 36.3 46 37.5 44.2 39.5 C42.4 42 41.4 45.5 40.6 50 Z"
          fill="#1E1916"/>
    <path d="M56 36 C60 33.2 67 32.6 72 34.2" stroke="#3A302A" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- beard: short and trimmed along the jaw -->
    <path d="M41.2 54 C41.6 66.5 49.5 75.3 60 75.3 C70.5 75.3 78.4 66.5 78.8 54
             C77.4 60.5 74 65 69.5 66.8 C66.5 67.9 63.5 68.3 60 68.3
             C56.5 68.3 53.5 67.9 50.5 66.8 C46 65 42.6 60.5 41.2 54 Z"
          fill="#2A221E" opacity="0.92"/>
    <!-- moustache -->
    <path d="M52.6 63 C55.5 60.6 64.5 60.6 67.4 63 C64.2 64.1 55.8 64.1 52.6 63 Z" fill="#2A221E"/>
    <!-- mouth: calm, slight smile -->
    <path d="M55.6 66 Q60 68.2 64.4 66" stroke="#8C4F3C" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M60.4 51.5 C59.8 55.5 58.6 58 57.6 59.3 Q60 60.6 62.4 59.3"
          stroke="#A86F4E" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- brows -->
    <path d="M47.5 45.6 Q52 43.4 56.4 45" stroke="#1E1916" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <path d="M63.6 45 Q68 43.4 72.5 45.6" stroke="#1E1916" stroke-width="2.1" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <g class="eyes">
      <ellipse cx="52" cy="51.3" rx="3.2" ry="2.2" fill="#FFFFFF"/>
      <ellipse cx="68" cy="51.3" rx="3.2" ry="2.2" fill="#FFFFFF"/>
      <g class="pupils">
        <circle cx="52" cy="51.3" r="1.6" fill="#3B2416"/>
        <circle cx="68" cy="51.3" r="1.6" fill="#3B2416"/>
        <circle cx="52.6" cy="50.7" r="0.45" fill="#FFFFFF"/>
        <circle cx="68.6" cy="50.7" r="0.45" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- glasses: thin navy frames -->
    <g stroke="#14123A" stroke-width="1" fill="#FFFFFF" fill-opacity="0.10">
      <rect x="46" y="47.2" width="12" height="8.4" rx="3"/>
      <rect x="62" y="47.2" width="12" height="8.4" rx="3"/>
    </g>
    <path d="M58 50.2 Q60 49 62 50.2" stroke="#14123A" stroke-width="1.1" fill="none"/>
    <path d="M46 49.5 L41.5 50.5 M74 49.5 L78.5 50.5" stroke="#14123A" stroke-width="1" fill="none"/>
    <!-- lens glint -->
    <g class="glint">
      <path d="M47.5 54.5 L50.5 48" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>
      <path d="M63.5 54.5 L66.5 48" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>
</svg>
